<style>
/* Identidade: Instituto Natiéle Barbosa. Dourado #AC804E para ação e "alugada", verdes #97B49F/#C0D1C6/#E1ECE1 para livre e fundos, âmbar para aviso, vermelho para atraso.
   Layout: menu lateral no computador, barra inferior no celular. */
:root{
  --bg:#0B241C; --card:#173A2E; --ink:#EDF3EC; --muted:#B9CDBF; --line:#3F6350; --line2:#2A4E3F;
  --gold:#AC804E; --cocoa:#AC804E; --brand:#AC804E; --brand-soft:#2F4A38;
  --sage:#97B49F; --sage-2:#2F5E4B; --sage-3:#1F4A38; --sage-ink:#C0D1C6;
  --blue:#AC804E; --blue-bg:#4A3A22; --blue-ink:#F2D9A8;
  --teal-bg:#1F4A38; --teal-ink:#CFE8D6; --teal:#7FB293;
  --amber:#E9B949; --amber-bg:#4F4121; --amber-ink:#FFE19A;
  --red:#D9644F; --red-bg:#5A2B28; --red-ink:#FFD2CC;
  --gray-bg:#274639; --gray-ink:#B9CDBF;
  --display:'Fraunces',Georgia,serif; --body:'Inter',system-ui,sans-serif; --brandfont:'Jost','Inter',system-ui,sans-serif;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;text-wrap:balance}
h1{font-size:28px;line-height:1.15;color:#5E4120}
h2{font-size:20px}
h3{font-size:17px}
.muted{color:var(--muted)}
.small{font-size:13px}
.shell{display:flex;min-height:100%}
.side{display:none}
.main{flex:1;min-width:0;padding:16px 16px 120px;max-width:1240px;width:100%;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.bottom{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:#fff;border-top:1px solid var(--line);padding:4px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
.bottom button{min-height:54px;border:0;background:none;color:var(--muted);font-weight:600;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.bottom button[aria-current="page"]{color:var(--brand);font-weight:700}
.bottom button[aria-current="page"] svg{color:var(--gold)}
.fab{position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:21;width:56px;height:56px;padding:0;border-radius:50%;box-shadow:0 4px 14px rgba(79,59,36,.32)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:0 16px;min-height:44px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn2{background:#fff;color:var(--ink);border:1px solid #CFC2AE;border-radius:10px;padding:0 14px;min-height:44px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.danger{background:var(--red)}
.btn[disabled]{background:#C9BBA7;cursor:not-allowed}
.btn:hover:not([disabled]),.btn2:hover{filter:brightness(.96)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card>h2:first-child{color:#5E4120}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:16px}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));align-items:start}
.g-cards{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.kpi{border:1px solid;border-radius:16px;padding:14px 16px}
.kpi b{display:block;font-family:var(--display);font-size:36px;line-height:1;font-weight:600}
.kpi span{display:block;font-weight:700;margin-top:6px;font-size:14px}
.kpi small{display:block;font-size:12.5px;margin-top:1px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid}
.c-livre{background:var(--teal-bg);color:var(--teal-ink);border-color:var(--sage)}
.c-ativa{background:var(--blue-bg);color:var(--blue-ink);border-color:#D9C2A0}
.c-proxima{background:var(--amber-bg);color:var(--amber-ink);border-color:#E8CF84}
.c-atrasada{background:var(--red-bg);color:var(--red-ink);border-color:#F0A8A3}
.c-reserva,.c-entrega{background:#fff;color:var(--blue-ink);border:1px dashed var(--blue)}
.c-higiene{background:#EFE8DA;color:#6B5630;border-color:#D9CBAE}
.c-manut{background:#EDEAE6;color:#4A4038;border-color:#CFC6BB;border-style:dashed}
.c-pago{background:var(--teal-bg);color:var(--teal-ink);border-color:#97B49F}
.c-pendente{background:var(--amber-bg);color:var(--amber-ink);border-color:#E8CF84}
.c-encerrada{background:var(--gray-bg);color:var(--gray-ink);border-color:#D9CFC4}
.alert{border:1px solid;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.alert.red{background:var(--red-bg);color:#5F1212;border-color:#F0A8A3}
.alert.amber{background:var(--amber-bg);color:#4D3500;border-color:#E8CF84}
.alert.blue{background:var(--blue-bg);color:#5E4120;border-color:#D9C2A0}
.alert.teal{background:var(--teal-bg);color:var(--teal-ink);border-color:#97B49F}
.item{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line2)}
.item:first-child{border-top:0}
.item.btnrow{width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font-size:14px;min-height:56px}
.seg{display:flex;gap:4px;background:#E8EFE8;border-radius:12px;padding:4px}
.seg button{border:0;border-radius:9px;padding:0 16px;min-height:44px;font-weight:600;font-size:14px;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.pill{min-height:44px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14px;background:#fff;color:var(--ink);border:1px solid #CFC2AE}
.pill[aria-pressed="true"]{background:var(--cocoa);color:#fff;border-color:var(--cocoa)}
.inp,select.inp,textarea.inp{min-height:44px;border:1px solid #CFC2AE;border-radius:10px;padding:8px 12px;font:inherit;background:#fff;color:var(--ink);width:100%}
textarea.inp{min-height:92px;resize:vertical}
label.l{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
.field{min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:14px}
.scroll{overflow-x:auto}
.bar{height:10px;background:#E8EFE8;border-radius:5px;overflow:hidden}
.bar i{display:block;height:10px;border-radius:5px}
.dl{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line2)}
.dl span:first-child{color:var(--muted)}
.dl span:last-child{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.big{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.1}
/* agenda */
.tl{min-width:820px}
.tl-row{display:grid;grid-template-columns:104px minmax(0,1fr);border-top:1px solid var(--line2)}
.tl-lab{position:sticky;left:0;z-index:3;background:#fff;padding:8px 8px 8px 0;display:flex;flex-direction:column;justify-content:center}
.tl-days{display:grid}
.tl-days div{text-align:center;font-size:11px;line-height:1.25;padding:3px 0;margin:0 1px}
.tl-cells{position:relative;display:grid;align-items:center;height:62px}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--cocoa);opacity:.55;pointer-events:none}
.tb{grid-row:1;align-self:center;height:42px;border-radius:9px;padding:3px 8px;overflow:hidden;text-align:left;display:flex;flex-direction:column;justify-content:center;border:0;margin:0 1px;min-width:0;font-family:inherit}
.tb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tb .a{font-size:12px;font-weight:600}.tb .b{font-size:11px}
.tb-ativa{background:var(--blue);color:#fff}
.tb-proxima{background:var(--amber);color:#3D2B00}
.tb-reserva,.tb-entrega{background:#F7F0E5;color:var(--blue-ink);border:2px dashed var(--blue)}
.tb-encerrada{background:#E8E1D9;color:var(--gray-ink)}
.tb-late{background:var(--red);color:#fff;align-items:center;padding:3px 0}.tb-late .a{font-size:11px}
.tb-clean{grid-row:1;align-self:center;height:42px;border-radius:9px;margin:0 1px;background:repeating-linear-gradient(45deg,#2B5B46 0 4px,#1F4A38 4px 8px)}
.free{text-align:center;font-size:12px;font-weight:700;border-radius:6px;margin:0 1px;padding:4px 0}
.free.y{background:var(--teal-bg);color:var(--teal-ink)}.free.n{background:var(--amber-bg);color:var(--amber-ink)}.free.p{color:var(--muted);font-weight:400}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;align-items:center}
.legend i{display:inline-block;width:16px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:6px}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mg-h{font-size:12px;font-weight:600;text-align:center;color:var(--muted);margin-bottom:6px}
.mc{background:#fff;border:1px solid var(--line2);border-radius:10px;padding:6px;min-height:112px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mc.past{background:#F8FAF7}.mc.today{border:2px solid var(--cocoa)}
.mc .n{font-weight:600;font-size:13px;padding:0 4px}
.mc.today .n{background:var(--cocoa);color:#fff;border-radius:999px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;padding:0}
.mc .f{font-size:11px;font-weight:600}
.ev{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:3px 6px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit}
.ev-ent{background:var(--blue-bg);color:var(--blue-ink)}.ev-ret{background:#FBF1D6;color:var(--amber-ink)}.ev-soon{background:var(--amber);color:#3D2B00}.ev-late{background:var(--red);color:#fff}.ev-done{background:var(--gray-bg);color:var(--gray-ink)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(46,42,36,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.dlg{background:#fff;width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pick{text-align:left;border-radius:12px;padding:10px 12px;min-height:60px;display:flex;flex-direction:column;gap:2px;font-family:inherit;color:var(--ink);background:#fff;border:1px solid #CFC2AE}
.pick[aria-pressed="true"]{background:var(--brand-soft);border:2px solid var(--brand)}
.pick[disabled]{background:#F5F1EC;border:1px solid #E5DBD0;cursor:not-allowed}
.toast{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:60;display:flex;justify-content:center;pointer-events:none}
.toast>div{pointer-events:auto;background:var(--cocoa);color:#fff;border-radius:14px;padding:12px 14px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast a{color:#fff;font-weight:700}
.toast.err>div{background:var(--red)}
.banner{background:var(--amber-bg);color:#4D3500;border:1px solid #E8CF84;border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.logo{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:0 4px}
.logo img{display:block;width:100%;max-width:216px;height:auto}
.logo small{font-family:var(--brandfont);font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage-ink);width:100%;text-align:center;margin-top:2px}
.mlogo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.mlogo img{height:46px;width:auto;display:block}
.mlogo small{font-family:var(--brandfont);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-ink)}
.empty-logo{display:block;width:min(280px,70%);height:auto;margin:0 auto 6px}
html{-webkit-text-size-adjust:100%}
button,a,.pick{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.inp,select.inp,textarea.inp{font-size:16px}
.tm{font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.dayh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:16px 2px 8px;border-top:2px solid var(--line);scroll-margin-top:12px}
.dayh:first-child{border-top:0;padding-top:0}
.dayh b{font-family:var(--display);font-size:18px;color:#5E4120}
.dayh.today b{color:#fff;background:var(--cocoa);border-radius:8px;padding:2px 10px}
.evrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px 10px 10px;min-height:64px;margin-bottom:8px;font-family:inherit;color:var(--ink);font-size:15px}
.evrow:active{background:var(--sage-3)}
.evrow .t{width:50px;flex:none;text-align:center;font-weight:700;font-size:16px;line-height:1.1}
.evrow .t small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:2px}
.evbar{width:5px;align-self:stretch;border-radius:3px;flex:none}
.dots{display:none}
.sync{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid;white-space:nowrap}
.sync:empty{display:none}
.s-ok{background:var(--teal-bg);color:var(--teal-ink);border-color:var(--sage)}
.s-sync{background:var(--amber-bg);color:var(--amber-ink);border-color:#E8CF84}
.s-off,.s-err{background:var(--red-bg);color:var(--red-ink);border-color:#F0A8A3}
.ov.opaque{background:var(--bg);align-items:center;padding:16px}
.ov.opaque .dlg{border-radius:20px;border:1px solid var(--line);max-width:420px}
.mgw{min-width:720px}
.v-lista .legend{display:none}
.tb,.tb-clean{position:relative;z-index:1}
.fgrid.f2{grid-template-columns:repeat(2,minmax(0,1fr))}
.sbar{position:sticky;bottom:0;background:#fff;padding:10px 0 2px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:6px;z-index:2}
.sbar:has(#hint:empty){gap:0}
.pick .chip{font-size:11px;padding:2px 8px}
.item.btnrow{cursor:pointer;gap:8px}
.item.btnrow:active{background:var(--sage-3)}
.item.btnrow svg{color:var(--muted);flex:none}
@media (max-width:699px){
  .main{padding:12px 12px 120px}
  h1{font-size:26px}
  .mlogo{margin:0 0 8px}.mlogo img{height:38px}
  .top{margin-bottom:12px}
  .banner{padding:8px 12px;font-size:13px;margin-bottom:10px;gap:8px}
  .banner .btn2{min-height:36px;padding:0 12px;font-size:13px}
  .card{padding:14px}
  .g-kpi{gap:10px;margin-bottom:12px}
  .kpi{padding:10px 12px}.kpi b{font-size:30px}.kpi small{display:none}
  .fscroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px}
  .fscroll::-webkit-scrollbar{display:none}
  .fscroll .pill{flex:none}
  .item>.row:last-child>.btn2.sm{flex:none;min-height:40px}
  .mgw{min-width:0}
  .mg{gap:3px}
  .mc{min-height:56px;padding:4px 2px;align-items:center;gap:2px}
  .mc .ev,.mc .f{display:none}
  .mc .n{padding:0}
  .mc .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
  .dots i{width:8px;height:8px;border-radius:50%;display:block}
  .item>.row:last-child{width:100%}
  .item>.row:last-child>.btn,.item>.row:last-child>.btn2{flex:1 1 44%}
  .tl{min-width:700px}
  .seg button{padding:0 12px}
}
@media (min-width:600px) and (max-width:959px){
  .main{padding:24px 28px 120px}
  .g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
  .bottom button{font-size:13px;min-height:62px}
  .ov{align-items:center}
  .dlg{border-radius:20px;max-width:620px;max-height:90%}
  .btn,.btn2{min-height:48px}
  .toast{bottom:88px}
}
@media (max-width:959px){#topNew{display:none}}
@media (min-width:960px){.mlogo{display:none}}
@media (min-width:960px){
  .side{display:flex;flex-direction:column;gap:28px;width:248px;flex:none;background:#fff;color:var(--ink);border-right:1px solid var(--line);padding:28px 16px;position:sticky;top:0;align-self:flex-start;height:100vh}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 14px;border-radius:12px;border:0;font-size:15px;font-weight:600;text-align:left;background:transparent;color:#6B5230}
  .side nav button:hover{background:var(--sage-3)}
  .side nav button[aria-current="page"]{background:var(--sage-2);color:#24402F}
  .bottom,.fab{display:none}
  .main{padding:28px 36px 48px}
  .g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
  h1{font-size:32px}
  .ov{align-items:center}
  .dlg{border-radius:20px;max-height:90%}
  .toast{bottom:24px}
}
@media (prefers-reduced-motion:no-preference){.dlg{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}

/* ===== REDESENHO VERDE: tema escuro verde, dourado e creme em todas as telas ===== */

.s-hoje .top{display:none}

.btn{background:linear-gradient(145deg,#F1D398,#BA8B4D);color:#1F231B;font-weight:700}
.btn.danger{background:linear-gradient(145deg,#F0B7A6,#D07A64);color:#3A0F0A}
.btn[disabled]{background:#3C5A4C;color:#8DA596}
.btn2{background:#244E3C;color:#EAF2EA;border:1px solid #6F9576}

.item{border-top-color:#2F5644}

.pill{background:#1D4636;color:#E6EFE6;border-color:#5E8668}
.pill[aria-pressed="true"]{background:linear-gradient(145deg,#F1D398,#BA8B4D);color:#1F231B;border-color:#D8B372}
.inp,select.inp,textarea.inp{background:#0F2C22;color:#F1F5EE;border-color:#5E8668;color-scheme:dark}
.inp::placeholder{color:#8FA99A}
.bar{background:#0F2C22}
.tl-lab{background:#143228}
.tl-today{background:#F1D398;opacity:.8}
.tb-ativa{background:#AC804E;color:#1F170B}
.tb-proxima{background:var(--amber);color:#2E2000}
.tb-reserva,.tb-entrega{background:#2A4A3A;color:#F2D9A8;border:2px dashed #AC804E}

.tb-late{background:#D9644F;color:#fff}
.tb-clean{background:repeating-linear-gradient(45deg,#2B5B46 0 4px,#1F4A38 4px 8px)}

/* ---- Hoje ---- */
.hoje{display:flex;flex-direction:column;gap:16px}
.hj-title{display:flex;align-items:center;justify-content:space-between;gap:14px}
.hj-title span.o{display:block;font-size:10px;letter-spacing:.2em;font-weight:800;color:#B5CBBB;margin-bottom:2px}
.hj-title h2{font-size:38px;line-height:1.05;color:#F3E7D1;font-weight:500}
.hj-title p{margin:6px 0 0;color:#DCE8DD;font-size:13px}
.hj-ico{width:48px;height:48px;display:grid;place-items:center;background:linear-gradient(145deg,#B28A4D,#73552C);color:#FFF4DE;border:1px solid #D4B678;border-radius:14px;flex:none}
.hj-cap{display:flex;align-items:center;gap:13px;border:1px solid #71907D;border-radius:18px;padding:14px 16px;background:linear-gradient(105deg,rgba(151,180,159,.24),rgba(16,48,37,.72))}
.hj-cap>svg{color:#C0D1C6;flex:none}
.hj-cap .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px;color:#D1E3D5}
.hj-cap .t strong{font:600 28px/1.15 var(--display);color:#EDC078}.hj-cap .t strong small{font:400 17px var(--body);color:#DFE8DE}
.hj-ring{width:64px;height:64px;flex:none;border-radius:50%;background:conic-gradient(#B9D9C3 var(--p),rgba(214,232,216,.16) var(--p));display:grid;place-items:center;position:relative}
.hj-ring:before{content:"";position:absolute;inset:8px;border-radius:50%;background:#173D30}
.hj-ring b{position:relative;font-size:14px;color:#F1F7EC}
.hj-cnt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hj-c{display:flex;align-items:center;gap:10px;min-width:0;text-align:left;font-family:inherit;border:0;color:#1E3428;background:#E1ECE1;padding:14px 12px;border-radius:17px;min-height:104px;cursor:pointer}
.hj-c:nth-child(2){background:#F5F0E8}
.hj-c>span{border-radius:12px;background:rgba(151,180,159,.4);width:38px;height:38px;display:grid;place-items:center;flex:none;color:#2F6048}
.hj-c div{display:flex;flex-direction:column;min-width:0;flex:1}
.hj-c strong{font:600 30px/1.05 var(--display);color:#79592B}
.hj-c b{font-size:13px;margin-top:2px}.hj-c small{font-size:11px;color:#55705F;margin-top:3px}
.hj-c i{font-style:normal;font-size:26px;font-weight:300;color:#53735D}
.hj-alert{display:flex;align-items:center;gap:10px;padding:14px 13px;border-radius:16px;background:#FBE1D9;color:#732E29;border:1px solid #F0AFA4;text-align:left;width:100%;font-family:inherit;cursor:pointer}
.hj-alert>span{width:38px;height:38px;flex:none;display:grid;place-items:center;background:rgba(160,47,37,.12);border-radius:11px}
.hj-alert>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.hj-alert strong{font-size:14px}.hj-alert small{font-size:12px;color:#8A564E}
.hj-alert>b{font-size:12px;border:1.5px solid #9B3028;border-radius:10px;padding:8px 10px;white-space:nowrap;color:#8F1D1D}
.hj-ok{display:flex;align-items:center;gap:10px;padding:14px 13px;border-radius:16px;background:#244B38;color:#E1ECE1;border:1px solid #557962}
.hj-ok small{display:block;color:#C0D1C6;font-size:12px}
.hj-h{display:flex;align-items:center;gap:9px;margin:6px 0 -6px;color:#EFE8D8;font-weight:700;font-size:17px}.hj-h svg{color:#E1B66A}
.hj-act{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hj-act button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;min-width:0;min-height:90px;padding:10px 2px;border:1px solid #52755D;border-radius:15px;background:linear-gradient(150deg,#294C3A,#1B3D30);color:#E7EFE7;font-size:12px;font-weight:600;line-height:1.25;text-align:center}
.hj-act button svg{color:#E6C48B}.hj-act button:active{background:#3B644B}
.hj-fc{padding:16px 13px;border:1px solid #668571;border-radius:17px;background:linear-gradient(150deg,#294B39,#123529);color:#F1F3EA}
.hj-fc-h{display:flex;justify-content:space-between;gap:8px;align-items:center}.hj-fc-h div{display:flex;gap:8px;align-items:center}.hj-fc-h svg{color:#E6B871}.hj-fc-h strong{font-size:17px}
.hj-fc-h button{border:0;background:none;color:#F1C989;font-weight:700;font-size:13px;min-height:36px}
.hj-tot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:14px 0;padding:11px 4px;background:#E4EEE4;border-radius:14px;color:#264838}
.hj-tot div{display:flex;flex-direction:column;text-align:center;gap:1px;border-right:1px solid #AFCCB7}.hj-tot div:last-child{border:0}
.hj-tot strong{font:600 26px/1.1 var(--display);color:#2F543B}.hj-tot div:last-child strong{color:#A24D3A}.hj-tot small{font-size:11px}
.hj-bars{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));align-items:end;gap:3px}
.hj-b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;min-width:0;border:1px solid transparent;border-radius:10px;padding:3px 0 4px;background:none;color:#DFEFE1;font-family:inherit;cursor:pointer}
.hj-b.t{border-color:#C0D1C6;background:rgba(192,209,198,.08)}
.hj-b b{font-size:11px}.hj-b i{width:min(80%,26px);border-radius:5px 5px 3px 3px;background:#9CC6A8;display:block}
.hj-b small{font-size:10px;font-weight:600}.hj-b em{font-style:normal;font-size:8.5px;color:#B7CDBD}
.hj-warn{background:#4C3C2D;border:1px solid #A17E4A;border-radius:15px;padding:14px;color:#FFE6C4}
.hj-warn p{font-size:12.5px;margin:6px 0 4px}
.hj-warn button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:7px;text-align:left;border:0;border-top:1px solid #7C623F;background:none;padding:10px 0;color:#FFE6C4;font-size:13px;font-weight:600;min-height:44px}
.hj-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.hj-panel{background:#193A2F;border:1px solid #466852;border-radius:17px;padding:15px 13px;min-width:0}
.hj-ph{margin-bottom:12px}.hj-ph .o{font-size:10px;font-weight:800;letter-spacing:.11em;color:#E0B475}
.hj-ph h3{font-size:21px;color:#F4EDE0;display:flex;align-items:center;gap:8px;margin-top:3px}
.hj-ph p{font-size:12.5px;color:#C0D1C6;margin:3px 0 0}
.hj-n{font:700 12px var(--body);background:#48634A;color:#F7E5C4;border-radius:30px;padding:3px 9px}
.hj-sub{font-size:12px;font-weight:800;color:#E1C38C;margin:12px 0 8px}
.hj-job{border:1px solid #64806A;border-left:4px solid #D8B372;border-radius:14px;padding:13px 12px;margin-bottom:10px;background:#244135;color:#F4F5EC;min-width:0}
.hj-job:last-child{margin-bottom:0}
.hj-job.late{border-color:#C77765;border-left-color:#F48A7A;background:#3C302D}
.hj-job.entrega{border-left-color:#B6D5B9}
.hj-jt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.hj-st{font-size:11px;font-weight:800;color:#FFE4AD;background:#564C30;padding:4px 9px;border-radius:99px}
.hj-job.entrega .hj-st{color:#DCEFE0;background:#2B664A}.hj-job.late .hj-st{color:#FFD5D2;background:#7B3933}
.hj-tm{font-size:12px;color:#CDDBCF}
.hj-p{display:flex;align-items:center;gap:10px;min-width:0;margin-bottom:8px}
.hj-av{background:#AC804E;color:#142B1E;width:40px;height:40px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800}
.hj-p h4{margin:0;font-size:15.5px;overflow-wrap:anywhere;font-weight:700;color:#F6F4EF}.hj-p p{margin:1px 0 0;font-size:12.5px;color:#CDDBCF}
.hj-d{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:#CDDBCF;margin:6px 0;min-width:0}.hj-d svg{flex:none;margin-top:1px}.hj-d span{overflow-wrap:anywhere}
.hj-x{font-size:12.5px;color:#FFD5D2;background:rgba(217,100,79,.16);border-radius:8px;padding:8px 10px;margin:8px 0}
.hj-ja{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.hj-ja .btn{width:100%;min-height:46px}
.hj-job.late .hj-ja>.btn{background:linear-gradient(145deg,#F0B7A6,#D07A64);color:#3A0F0A}
.hj-mini{display:flex;gap:6px;flex-wrap:wrap}
.hj-mini>*{flex:1 1 auto;min-height:40px;font-size:12px;padding:0 10px}
.hj-empty{display:flex;align-items:center;gap:12px;background:#244E3A;border:1px dashed #688B71;padding:16px 13px;border-radius:13px;color:#E8F1E5}
.hj-empty b{font-size:13.5px}.hj-empty p{font-size:12.5px;margin:3px 0 0;color:#BBCFBF}.hj-empty svg{flex:none}
.hj-nx{display:flex;align-items:center;gap:10px;padding:11px 1px;border:0;border-top:1px solid #456550;width:100%;background:transparent;color:#EDF1EB;text-align:left;font:inherit;min-height:56px;cursor:pointer}
.hj-nx:first-of-type{border-top:0}
.hj-nd{width:54px;flex:none;text-align:center}.hj-nd b{display:block;font-size:14px}.hj-nd small{display:block;font-size:11px;color:#C0D1C6}
.hj-nc{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}.hj-nc strong{font-size:13.5px;overflow-wrap:anywhere}.hj-nc small{font-size:12px;color:#C0D1C6}
.hj-k{font-size:10.5px;font-weight:800;flex:none;background:#725534;color:#F9EACF;padding:5px 7px;border-radius:7px}.hj-k.e{background:#365B44;color:#D6E8DB}
.hj-info{display:flex;align-items:center;gap:11px;padding:13px;text-align:left;border:1px solid #5B7C62;border-radius:14px;background:#244334;font:inherit;color:#EEF2E9;width:100%;min-height:60px;cursor:pointer;margin-bottom:9px}
.hj-info>span:first-child{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:#345C45;color:#E4D4B5;flex:none}
.hj-info>span:nth-child(2){display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}.hj-info b{font-size:13px}.hj-info small{font-size:12px;color:#C0D1C6}.hj-info>strong{font-size:12px;color:#E7C28C}
.hj-chairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:10px}
#hj-ret,#hj-ent{scroll-margin-top:16px}
@media(min-width:520px){.hj-ja{flex-direction:row;align-items:center}.hj-ja .btn{width:auto;flex:none}.hj-mini{flex:1}}
@media(min-width:960px){
  .hj-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
  .hj-l,.hj-r{display:flex;flex-direction:column;gap:16px}
  .hj-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hj-title h2{font-size:44px}
}
@media(max-width:380px){.hj-act button{font-size:10.5px}.hj-fc{padding:14px 9px}.hj-b em{font-size:8px}.hj-title h2{font-size:32px}}
</style>

function backupText() { return JSON.stringify(Object.assign({}, S, { schema: 2, exportedAt: new Date().toISOString() })); }
var ISO = /^\d{4}-\d{2}-\d{2}$/;
function backupError(o) {
  if (!o || typeof o !== 'object' || !Array.isArray(o.chairs) || !Array.isArray(o.rentals)) return 'Esse texto não parece um backup deste sistema.';
  var ids = {}, i;
  for (i = 0; i < o.chairs.length; i++) { var c = o.chairs[i]; if (!c || !c.id || typeof c.code !== 'string' || !c.code) return 'O backup tem uma poltrona sem código (item ' + (i + 1) + ').'; ids[c.id] = 1; }
  for (i = 0; i < o.rentals.length; i++) {
    var r = o.rentals[i];
    if (!r || !r.id || typeof r.client !== 'string' || !r.client.trim()) return 'O backup tem uma locação sem cliente (item ' + (i + 1) + ').';
    if (!ids[r.chair]) return 'A locação de ' + r.client + ' aponta para uma poltrona que não existe no backup.';
    if (!ISO.test(r.start || '') || !ISO.test(r.end || '') || r.end < r.start) return 'A locação de ' + r.client + ' tem datas inválidas.';
    if (isNaN(+r.rate)) return 'A locação de ' + r.client + ' tem valor inválido.';
  }
  return '';
}
function restoreFrom(txt) {
  var o = null; try { o = JSON.parse(txt); } catch (e) { }
  var err = o ? backupError(o) : 'Esse texto não parece um backup deste sistema.';
  if (err) { var el = $('#rsErr'); if (el) el.textContent = err; return; }
  var when = ''; if (o.exportedAt) { var d = new Date(o.exportedAt); if (!isNaN(d)) when = ' feito em ' + p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear() + ' às ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
  ui.restoreStaged = o;
  ui.modal = { t: 'confirm', title: 'Substituir os dados atuais?', text: 'Este backup' + when + ' tem ' + pl(o.chairs.length, 'poltrona', 'poltronas') + ' e ' + pl(o.rentals.length, 'locação', 'locações') + '. Hoje o sistema tem ' + pl(S.chairs.length, 'poltrona', 'poltronas') + ' e ' + pl(S.rentals.length, 'locação', 'locações') + '. Ao confirmar, esses dados são substituídos' + (cloud.on ? ' em todos os aparelhos' : '') + '. Se o backup for antigo, você perde o que foi feito depois dele.', act: 'doRestoreOk', label: 'Substituir pelo backup' };
  render();
}

    if (id) {
