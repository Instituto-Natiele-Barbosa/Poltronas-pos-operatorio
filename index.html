<style>
/* Identidade: Instituto Natiéle Barbosa. Dourado #AC804E para ação e "alugada", verdes #97B49F/#C0D1C6/#E1ECE1 para livre e fundos, âmbar para aviso, vermelho para atraso.
   Layout: menu lateral no computador, barra inferior no celular. */
:root{
  --bg:#F6F9F5; --card:#FFFFFF; --ink:#2E2A24; --muted:#6A675C; --line:#DCE6DC; --line2:#E8EFE8;
  --gold:#AC804E; --cocoa:#4F3B24; --brand:#8E6636; --brand-soft:#F3E9DB;
  --sage:#97B49F; --sage-2:#C0D1C6; --sage-3:#E1ECE1; --sage-ink:#2B5440;
  --blue:#946835; --blue-bg:#F3E9DB; --blue-ink:#5E4120;
  --teal-bg:#E1ECE1; --teal-ink:#2B5440; --teal:#5E8F72;
  --amber:#F2C14E; --amber-bg:#FBEFC9; --amber-ink:#6B4A00;
  --red:#C0392B; --red-bg:#FBDDDB; --red-ink:#8F1D1D;
  --gray-bg:#ECEBE6; --gray-ink:#5B574D;
  --display:'Fraunces',Georgia,serif; --body:'Inter',system-ui,sans-serif; --brandfont:'Jost','Inter',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;text-wrap:balance}
h1{font-size:28px;line-height:1.15;color:#5E4120}
h2{font-size:20px}
h3{font-size:17px}
.muted{color:var(--muted)}
.small{font-size:13px}
.shell{display:flex;min-height:100%}
.side{display:none}
.main{flex:1;min-width:0;padding:16px 16px 120px;max-width:1240px;width:100%;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.bottom{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:#fff;border-top:1px solid var(--line);padding:4px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
.bottom button{min-height:54px;border:0;background:none;color:var(--muted);font-weight:600;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.bottom button[aria-current="page"]{color:var(--brand);font-weight:700}
.bottom button[aria-current="page"] svg{color:var(--gold)}
.fab{position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:21;width:56px;height:56px;padding:0;border-radius:50%;box-shadow:0 4px 14px rgba(79,59,36,.32)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:0 16px;min-height:44px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn2{background:#fff;color:var(--ink);border:1px solid #CFC2AE;border-radius:10px;padding:0 14px;min-height:44px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.danger{background:var(--red)}
.btn[disabled]{background:#C9BBA7;cursor:not-allowed}
.btn:hover:not([disabled]),.btn2:hover{filter:brightness(.96)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card>h2:first-child{color:#5E4120}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:16px}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));align-items:start}
.g-cards{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.kpi{border:1px solid;border-radius:16px;padding:14px 16px}
.kpi b{display:block;font-family:var(--display);font-size:36px;line-height:1;font-weight:600}
.kpi span{display:block;font-weight:700;margin-top:6px;font-size:14px}
.kpi small{display:block;font-size:12.5px;margin-top:1px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid}
.c-livre{background:var(--teal-bg);color:var(--teal-ink);border-color:var(--sage)}
.c-ativa{background:var(--blue-bg);color:var(--blue-ink);border-color:#D9C2A0}

.toast.err>div{background:var(--red)}
.banner{background:var(--amber-bg);color:#4D3500;border:1px solid #E8CF84;border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}

.logo small{font-family:var(--brandfont);font-weight:400;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage-ink);width:100%;text-align:center;margin-top:2px}
.mlogo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.mlogo img{height:46px;width:auto;display:block}
.mlogo small{font-family:var(--brandfont);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-ink)}
.empty-logo{display:block;width:min(280px,70%);height:auto;margin:0 auto 6px}
html{-webkit-text-size-adjust:100%}
button,a,.pick{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.inp,select.inp,textarea.inp{font-size:16px}
.tm{font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}

.dayh b{font-family:var(--display);font-size:18px;color:#5E4120}
.dayh.today b{color:#fff;background:var(--cocoa);border-radius:8px;padding:2px 10px}
.evrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px 10px 10px;min-height:64px;margin-bottom:8px;font-family:inherit;color:var(--ink);font-size:15px}

.evbar{width:5px;align-self:stretch;border-radius:3px;flex:none}
.dots{display:none}
.sync{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid;white-space:nowrap}

.s-ok{background:var(--teal-bg);color:var(--teal-ink);border-color:var(--sage)}
.s-sync{background:var(--amber-bg);color:var(--amber-ink);border-color:#E8CF84}

.ov.opaque{background:var(--bg);align-items:center;padding:16px}

.mgw{min-width:720px}
.v-lista .legend{display:none}
.tb,.tb-clean{position:relative;z-index:1}
.fgrid.f2{grid-template-columns:repeat(2,minmax(0,1fr))}

.item.btnrow svg{color:var(--muted);flex:none}

    if (id) {

      if (qty > 1) {
